[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapeflow-py"
version = "0.4.0"
description = "Opinionated Playwright scraping workflow engine: retries, rate limiting, anti-detection, robots.txt compliance, Pydantic spec-driven and LLM-powered extraction, sessions, and metrics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Irfan Ali", email = "irfanali29@hotmail.com" }]
maintainers = [{ name = "Irfan Ali", email = "irfanali29@hotmail.com" }]
keywords = [
    "web-scraping",
    "scraping",
    "scraper",
    "crawler",
    "playwright",
    "browser-automation",
    "workflow",
    "data-extraction",
    "llm-extraction",
    "mistral",
    "pydantic",
    "rate-limiting",
    "retry",
    "robots-txt",
    "anti-detection",
    "asyncio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "playwright>=1.40.0",
    "aiohttp>=3.9.0",
    "tenacity>=8.2.0",
    "pydantic>=2.0.0",
    "mistralai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.7.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/irfanalidv/scrapeflow-py"
Documentation = "https://github.com/irfanalidv/scrapeflow-py#readme"
Repository = "https://github.com/irfanalidv/scrapeflow-py"
Issues = "https://github.com/irfanalidv/scrapeflow-py/issues"
Changelog = "https://github.com/irfanalidv/scrapeflow-py/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["scrapeflow*"]

[tool.setuptools.package-data]
scrapeflow = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--tb=short"
